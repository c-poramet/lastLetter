<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prefix Word Finder</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpolygon points='32,8 56,56 8,56' fill='%23999'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <span class="header-title">Prefix Finder</span>
      <span class="header-dot" aria-hidden="true"></span>
      <span class="header-sub">type anywhere</span>
      <button
        id="settingsToggleBtn"
        class="icon-btn"
        type="button"
        aria-label="Open settings"
        aria-expanded="false"
        aria-controls="settingsMenu"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M12 15.2A3.2 3.2 0 1 0 12 8.8a3.2 3.2 0 0 0 0 6.4Zm7.05-3.2a6.86 6.86 0 0 0-.06-.9l1.74-1.35a.6.6 0 0 0 .15-.76l-1.65-2.86a.6.6 0 0 0-.72-.26l-2.05.82a6.95 6.95 0 0 0-1.56-.9l-.3-2.18a.6.6 0 0 0-.6-.51h-3.3a.6.6 0 0 0-.6.5l-.3 2.2c-.56.2-1.08.5-1.56.9L4.5 5.87a.6.6 0 0 0-.72.26L2.13 9a.6.6 0 0 0 .15.75l1.73 1.35c-.04.3-.06.6-.06.9s.02.6.06.9l-1.73 1.35a.6.6 0 0 0-.15.76l1.65 2.86c.15.26.46.37.72.26l2.04-.82c.48.4 1 .7 1.56.9l.3 2.18c.04.3.29.51.6.51h3.3a.6.6 0 0 0 .6-.5l.3-2.2c.56-.2 1.08-.5 1.56-.9l2.05.82c.26.1.57 0 .72-.26l1.65-2.86a.6.6 0 0 0-.15-.75l-1.74-1.36c.04-.29.06-.59.06-.89Z"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <div class="header-stats">
        <span class="guesses-left-badge badge-dict" id="dictionarySize">loading words</span>
        <span class="guesses-left-badge badge-match" id="matchCount">0 matches</span>
        <span class="guesses-left-badge badge-shown" id="renderCount">0 shown</span>
      </div>
    </header>

    <main class="main">
      <section id="solverLayout" class="solver-layout">
        <aside class="left-panel panel">
          <div class="input-sticky-wrap">
            <h2 class="panel-title">Search Prefix</h2>

            <label for="prefixInput" class="section-label">Current letters</label>
            <input
              id="prefixInput"
              class="word-input"
              type="text"
              autocomplete="off"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              value=""
              placeholder="TYPE"
              aria-label="Current letter prefix"
            />

            <div class="controls-row">
              <button id="clearBtn" class="btn-reset" type="button">Clear</button>
            </div>
          </div>

          <p class="helper-copy">
            Keyboard: letters append, Backspace removes, Space or Escape clears. Works no matter where focus is.
          </p>
        </aside>

        <aside id="settingsMenu" class="settings-menu panel" aria-hidden="true">
          <div class="settings-head">
            <h2 class="panel-title settings-title">Settings</h2>
          </div>

          <label for="sortSelect" class="section-label">Sort matches by</label>
          <select id="sortSelect" class="sort-select" aria-label="Sort matching words">
            <option value="alpha-asc">A to Z</option>
            <option value="alpha-desc">Z to A</option>
            <option value="length-asc" selected>Length: Short to Long</option>
            <option value="length-desc">Length: Long to Short</option>
          </select>

          <label for="maxShownSelect" class="section-label">Max shown</label>
          <select id="maxShownSelect" class="sort-select" aria-label="Maximum number of shown matches">
            <option value="100">100</option>
            <option value="500">500</option>
            <option value="1000" selected>1,000</option>
            <option value="5000">5,000</option>
            <option value="25000">25,000</option>
            <option value="50000">50,000</option>
          </select>

          <label for="flowToggleBtn" class="section-label">Result order</label>
          <button
            id="flowToggleBtn"
            class="btn-reset flow-toggle-btn"
            type="button"
            aria-label="Toggle result display order"
          >
            Order: Left-Right
          </button>

          <p class="settings-hint">Desktop shortcut: press T to open or close settings.</p>
        </aside>

        <section class="right-panel panel" aria-live="polite">
          <div class="panel-head">
            <h2 class="panel-title panel-title-right">Matching Words</h2>
            <span id="statusTag" class="setting-tag">waiting</span>
          </div>

          <p id="renderNote" class="render-note"></p>
          <div id="results" class="results-grid"></div>
        </section>
      </section>
    </main>

    <footer class="footer">
      <span class="footer-credit">Wordlist: dwyl/english-words</span>
    </footer>

    <script src="app.js" defer></script>
  </body>
</html>
